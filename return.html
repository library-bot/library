<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NCPSC Borrow Dashboard</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:linear-gradient(135deg,#dbeafe,#f8fafc);
  padding:20px;
}

/* TITLE */
.title{
  text-align:center;
  font-size:36px;
  font-weight:800;
  color:#1d4ed8;
  margin-bottom:18px;
}

/* BUTTON */
.topBar{
  text-align:center;
  margin-bottom:15px;
}

.refreshBtn{
  padding:10px 18px;
  border:none;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.refreshBtn:hover{
  background:#1d4ed8;
}

/* TABLE WRAPPER */
.tableBox{
  background:white;
  border-radius:14px;
  overflow-x:auto;
  box-shadow:0 8px 25px rgba(0,0,0,0.12);
}

/* TABLE */
table{
  width:max-content;
  min-width:100%;
  border-collapse:collapse;
}

/* HEADER */
th{
  background:#2563eb;
  color:white;
  padding:10px 12px;
  font-size:13px;
  white-space:nowrap;
  text-transform:uppercase;
}

/* CELLS */
td{
  padding:8px 12px;
  font-size:13px;
  text-align:center;
  color:#1f2937;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;

  border-bottom:1px solid #e5e7eb;
}

/* ROW */
tr{
  line-height:1.1;
}

tr:hover{
  background:#f1f5f9;
}

/* SELECT */
select{
  padding:6px;
  border-radius:6px;
  border:1px solid #cbd5e1;
  font-size:12px;
}

/* BUTTON */
.saveBtn{
  padding:6px 10px;
  border:none;
  border-radius:6px;
  background:#16a34a;
  color:white;
  font-size:12px;
  cursor:pointer;
}

.saveBtn:hover{
  background:#15803d;
}

/* LOADING */
.loading{
  padding:18px;
  font-weight:bold;
  color:#2563eb;
}

</style>
</head>

<body>

<div class="title">📚 NCPSC Borrow Dashboard</div>

<div class="topBar">
<button class="refreshBtn" onclick="loadData()">🔄 Refresh</button>
</div>

<div class="tableBox">

<table>

<thead>
<tr>
<th>CODE</th>
<th>ID</th>
<th>BORROW</th>
<th>RETURN</th>
<th>BOOK</th>
<th>PRICE</th>
<th>STATUS</th>
<th>SAVE</th>
</tr>
</thead>

<tbody id="tableBody">
<tr>
<td colspan="8" class="loading">Loading...</td>
</tr>
</tbody>

</table>

</div>

<script>

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbz0xuEEwJnB8oS1xfxOXQXt2I6-3LBgGxNhwKbVJh7DxxolEbLODbNBIKo2Q-2Tyh_f2A/exec";

async function loadData(){

  try{

    const res = await fetch(WEB_APP_URL);
    const data = await res.json();

    let rows = "";

    data.forEach((item, i) => {

      if((item.status || "").toLowerCase() !== "borrowed") return;

      rows += `
      <tr>

        <td>${item.code || ""}</td>
        <td>${item.borrowerId || ""}</td>
        <td>${item.borrowDate || ""}</td>
        <td>${item.submissionDate || ""}</td>
        <td>${item.bookName || ""}</td>
        <td>${item.price || ""}</td>

        <td>
          <select id="st${i}">
            <option value="">Select</option>

            <!-- FIX: Borrowed now inside dropdown -->
            <option value="Borrowed" selected>Borrowed</option>
            <option value="Returned">Returned</option>
            <option value="Lost">Lost</option>
            <option value="Damaged">Damaged</option>
          </select>
        </td>

        <td>
          <button class="saveBtn" onclick="saveStatus(${i + 2})">
            Save
          </button>
        </td>

      </tr>`;
    });

    document.getElementById("tableBody").innerHTML =
      rows || `<tr><td colspan="8" class="loading">No Borrowed Books</td></tr>`;

  } catch(e){
    console.log(e);
  }
}

async function saveStatus(row){

  const select = document.querySelectorAll("select")[row - 2];
  const status = select.value;

  if(!status){
    alert("Select status");
    return;
  }

  await fetch(WEB_APP_URL,{
    method:"POST",
    headers:{ "Content-Type":"text/plain" },
    body: JSON.stringify({ row, status })
  });

  alert("Saved!");
  loadData();
}

loadData();

</script>

</body>
</html>
