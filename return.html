<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NCPSC Borrow Dashboard</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#dbeafe,#f8fafc);
  min-height:100vh;
  padding:20px;
}

.title{
  text-align:center;
  font-size:38px;
  font-weight:bold;
  color:#1d4ed8;
  margin-bottom:25px;
}

.topBar{
  text-align:center;
  margin-bottom:20px;
}

.refreshBtn{
  padding:12px 22px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

.refreshBtn:hover{
  background:#1d4ed8;
}

.tableBox{
  overflow-x:auto;
  border-radius:20px;
  background:white;
  box-shadow:0 6px 20px rgba(0,0,0,0.1);
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:1100px;
}

th{
  background:#2563eb;
  color:white;
  padding:15px;
  font-size:14px;
}

td{
  padding:14px;
  border-bottom:1px solid #e2e8f0;
  text-align:center;
  font-size:14px;
  color:#334155;
}

tr:hover{
  background:#f8fafc;
}

select{
  padding:8px 10px;
  border-radius:8px;
  border:1px solid #cbd5e1;
  font-weight:bold;
  background:#f8fafc;
}

.saveBtn{
  padding:8px 14px;
  border:none;
  border-radius:8px;
  background:#16a34a;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.saveBtn:hover{
  background:#15803d;
}

.loading{
  padding:25px;
  text-align:center;
  font-size:18px;
  color:#2563eb;
  font-weight:bold;
}

.returned{
  color:#15803d;
  font-weight:bold;
}

.lost{
  color:#dc2626;
  font-weight:bold;
}

.damaged{
  color:#d97706;
  font-weight:bold;
}

</style>

</head>

<body>

<div class="title">
📚 NCPSC Borrow Dashboard
</div>

<div class="topBar">

<button class="refreshBtn" onclick="loadData()">
🔄 Refresh
</button>

</div>

<div class="tableBox">

<table>

<thead>

<tr>

<th>CODE</th>
<th>BORROWER ID</th>
<th>BORROW DATE</th>
<th>SUBMISSION DATE</th>
<th>BOOK NAME</th>
<th>PRICE</th>
<th>STATUS</th>
<th>SAVE</th>

</tr>

</thead>

<tbody id="tableBody">

<tr>

<td colspan="8" class="loading">
Loading Data...
</td>

</tr>

</tbody>

</table>

</div>

<script>

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbz0xuEEwJnB8oS1xfxOXQXt2I6-3LBgGxNhwKbVJh7DxxolEbLODbNBIKo2Q-2Tyh_f2A/exec";





async function loadData(){

  try{

    const response =
      await fetch(WEB_APP_URL);

    const data =
      await response.json();

    let rows = "";



    data.forEach((item,index)=>{

      let statusClass = "";

      if(item.status=="Returned"){
        statusClass = "returned";
      }

      else if(item.status=="Lost"){
        statusClass = "lost";
      }

      else if(item.status=="Damaged"){
        statusClass = "damaged";
      }



      rows += `

      <tr>

        <td>${item.code || ""}</td>

        <td>${item.borrowerId || ""}</td>

        <td>${item.borrowDate || ""}</td>

        <td>${item.submissionDate || ""}</td>

        <td>${item.bookName || ""}</td>

        <td>${item.price || ""}</td>

        <td>

          <select id="status${index}">

            <option value="">Select</option>

            <option value="Returned"
            ${item.status=="Returned" ? "selected" : ""}>
            Returned
            </option>

            <option value="Lost"
            ${item.status=="Lost" ? "selected" : ""}>
            Lost
            </option>

            <option value="Damaged"
            ${item.status=="Damaged" ? "selected" : ""}>
            Damaged
            </option>

          </select>

          <div class="${statusClass}"
          style="margin-top:6px;">
            ${item.status || ""}
          </div>

        </td>

        <td>

          <button class="saveBtn"
          onclick="saveStatus(${index})">

          Save

          </button>

        </td>

      </tr>

      `;
    });




    if(rows==""){

      rows = `

      <tr>

      <td colspan="8" class="loading">
      No Data Found
      </td>

      </tr>

      `;
    }



    document.getElementById("tableBody")
      .innerHTML = rows;

  }

  catch(error){

    console.log(error);

    document.getElementById("tableBody")
    .innerHTML = `

    <tr>

    <td colspan="8" class="loading">
    Failed To Load Data
    </td>

    </tr>

    `;
  }

}







async function saveStatus(index){

  const status =
    document.getElementById(
      "status"+index
    ).value;



  if(status==""){

    alert("Please Select Status");

    return;
  }



  try{

    const response =
      await fetch(WEB_APP_URL,{

      method:"POST",

      mode:"cors",

      headers:{
        "Content-Type":"text/plain"
      },

      body:JSON.stringify({

        row:index + 2,
        status:status

      })

    });




    const result =
      await response.text();

    console.log(result);




    if(
      result.includes("Updated")
      ||
      result.includes("Success")
    ){

      alert("✅ Status Saved");

      loadData();

    }

    else{

      alert(result);
    }

  }

  catch(error){

    console.log(error);

    alert("❌ Save Failed");
  }

}





loadData();

</script>

</body>

</html>
