<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NCPSC Borrow Dashboard</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:
  radial-gradient(circle at top left,#fef3c7 0%,transparent 25%),
  radial-gradient(circle at top right,#bfdbfe 0%,transparent 25%),
  radial-gradient(circle at bottom left,#fbcfe8 0%,transparent 25%),
  radial-gradient(circle at bottom right,#bbf7d0 0%,transparent 25%),
  linear-gradient(135deg,#eff6ff,#ffffff,#fdf4ff);
  min-height:100vh;
  padding:20px;
}

.title{
  text-align:center;
  font-size:40px;
  font-weight:bold;
  color:#1e293b;
  margin-bottom:25px;
  background:linear-gradient(90deg,#2563eb,#7c3aed,#ec4899);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:0 4px 15px rgba(124,58,237,0.15);
}

.topBar{
  text-align:center;
  margin-bottom:22px;
}

.refreshBtn{
  padding:13px 24px;
  border:none;
  border-radius:14px;
  background:linear-gradient(135deg,#3b82f6,#8b5cf6);
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
  box-shadow:0 8px 20px rgba(59,130,246,0.35);
}

.refreshBtn:hover{
  transform:translateY(-2px) scale(1.02);
  box-shadow:0 10px 25px rgba(139,92,246,0.4);
}

.tableBox{
  overflow-x:auto;
  border-radius:24px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,0.6);
  box-shadow:
  0 10px 40px rgba(99,102,241,0.18),
  0 4px 15px rgba(236,72,153,0.1);
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:1100px;
}

th{
  background:linear-gradient(135deg,#60a5fa,#8b5cf6);
  color:white;
  padding:16px;
  font-size:14px;
  letter-spacing:0.5px;
}

td{
  padding:15px;
  border-bottom:1px solid rgba(226,232,240,0.7);
  text-align:center;
  font-size:14px;
  color:#334155;
  background:rgba(255,255,255,0.55);
}

tr:hover td{
  background:rgba(219,234,254,0.55);
  transition:0.3s;
}

select{
  padding:9px 12px;
  border-radius:10px;
  border:1px solid #cbd5e1;
  font-weight:bold;
  background:white;
  color:#334155;
  outline:none;
  box-shadow:0 3px 8px rgba(0,0,0,0.05);
}

.saveBtn{
  padding:9px 16px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,#22c55e,#10b981);
  color:white;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
  box-shadow:0 6px 15px rgba(16,185,129,0.25);
}

.saveBtn:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 20px rgba(16,185,129,0.35);
}

.loading{
  padding:28px;
  text-align:center;
  font-size:18px;
  color:#4f46e5;
  font-weight:bold;
}

@media(max-width:768px){

  .title{
    font-size:28px;
  }

  th,td{
    font-size:12px;
    padding:10px;
  }

}

  th,td{
    font-size:12px;
    padding:10px;
  }

}

</style>

</head>

<body>

<div class="title">
📚 NCPSC Borrow Dashboard
</div>

<div class="topBar">

<button class="refreshBtn" onclick="loadData()">
🔄 Refresh
</button>

</div>

<div class="tableBox">

<table>

<thead>

<tr>

<th>CODE</th>
<th>BORROWER ID</th>
<th>BORROW DATE</th>
<th>SUBMISSION DATE</th>
<th>BOOK NAME</th>
<th>PRICE</th>
<th>STATUS</th>
<th>SAVE</th>

</tr>

</thead>

<tbody id="tableBody">

<tr>

<td colspan="8" class="loading">
Loading Data...
</td>

</tr>

</tbody>

</table>

</div>

<script>

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbz0xuEEwJnB8oS1xfxOXQXt2I6-3LBgGxNhwKbVJh7DxxolEbLODbNBIKo2Q-2Tyh_f2A/exec";






async function loadData(){

  try{

    const response =
      await fetch(WEB_APP_URL);

    const data =
      await response.json();

    let rows = "";



    data.forEach((item,index)=>{

      // SHOW ONLY BORROWED BOOKS

      if(
        !item.status ||
        item.status.toLowerCase() != "borrowed"
      ){
        return;
      }



      rows += `

      <tr>

        <td>${item.code || ""}</td>

        <td>${item.borrowerId || ""}</td>

        <td>
        ${item.borrowDate
        ? new Date(item.borrowDate)
        .toLocaleDateString("en-GB")
        : ""}
        </td>

        <td>
        ${item.submissionDate
        ? new Date(item.submissionDate)
        .toLocaleDateString("en-GB")
        : ""}
        </td>

        <td>${item.bookName || ""}</td>

        <td>${item.price || ""}</td>

        <td>

          <select id="status${index}">

            <option value="">Select</option>

            <option value="Returned">
            Returned
            </option>

            <option value="Lost">
            Lost
            </option>

            <option value="Damaged">
            Damaged
            </option>

          </select>

          <div style="
            margin-top:6px;
            color:#6b8bb6;
            font-weight:bold;
          ">
            Borrowed
          </div>

        </td>

        <td>

          <button class="saveBtn"
          onclick="saveStatus(${index + 2})">

          Save

          </button>

        </td>

      </tr>

      `;
    });




    if(rows==""){

      rows = `

      <tr>

      <td colspan="8" class="loading">
      No Borrowed Books
      </td>

      </tr>

      `;
    }



    document.getElementById("tableBody")
      .innerHTML = rows;

  }

  catch(error){

    console.log(error);

    document.getElementById("tableBody")
    .innerHTML = `

    <tr>

    <td colspan="8" class="loading">
    Failed To Load Data
    </td>

    </tr>

    `;
  }

}









async function saveStatus(row){

  const select =
    document.querySelector(
      `button[onclick="saveStatus(${row})"]`
    ).parentElement.parentElement
    .querySelector("select");



  const status =
    select.value;



  if(status==""){

    alert("Please Select Status");

    return;
  }



  try{

    const response =
      await fetch(WEB_APP_URL,{

      method:"POST",

      mode:"cors",

      headers:{
        "Content-Type":"text/plain"
      },

      body:JSON.stringify({

        row:row,
        status:status

      })

    });




    const result =
      await response.text();

    console.log(result);




    if(
      result.includes("Updated")
      ||
      result.includes("Success")
    ){

      alert("✅ Status Saved");

      loadData();

    }

    else{

      alert(result);
    }

  }

  catch(error){

    console.log(error);

    alert("❌ Save Failed");
  }

}





loadData();

</script>

</body>

</html>
