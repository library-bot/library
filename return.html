<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Borrowed Books Dashboard</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#dbeafe,#f8fafc);
  padding:20px;
}

.title{
  text-align:center;
  font-size:38px;
  font-weight:bold;
  color:#1d4ed8;
  margin-bottom:25px;
}

.buttonBox{
  text-align:center;
  margin-bottom:20px;
}

.refreshBtn{
  padding:12px 20px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.refreshBtn:hover{
  background:#1d4ed8;
}

.table-container{
  overflow-x:auto;
  border-radius:18px;
  box-shadow:0 6px 20px rgba(0,0,0,0.1);
}

table{
  width:100%;
  border-collapse:collapse;
  background:white;
  min-width:1000px;
}

th{
  background:#2563eb;
  color:white;
  padding:15px;
  font-size:14px;
}

td{
  padding:14px;
  border-bottom:1px solid #e2e8f0;
  text-align:center;
  font-size:14px;
}

tr:hover{
  background:#f1f5f9;
}

select{
  padding:8px;
  border-radius:8px;
  border:1px solid #cbd5e1;
  font-weight:bold;
}

.saveBtn{
  padding:8px 14px;
  border:none;
  border-radius:8px;
  background:#16a34a;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.saveBtn:hover{
  background:#15803d;
}

.loading{
  text-align:center;
  color:#2563eb;
  font-size:18px;
  padding:25px;
}

@media(max-width:768px){

  .title{
    font-size:28px;
  }

  th,td{
    font-size:12px;
    padding:10px;
  }

}

</style>

</head>

<body>

<div class="title">
📚 Borrowed Books Dashboard
</div>

<div class="buttonBox">

<button class="refreshBtn" onclick="loadData()">
🔄 Refresh
</button>

</div>

<div class="table-container">

<table>

<thead>

<tr>
  <th>CODE</th>
  <th>BORROWER ID</th>
  <th>BORROW DATE</th>
  <th>SUBMISSION DATE</th>
  <th>BOOK NAME</th>
  <th>PRICE</th>
  <th>STATUS</th>
  <th>SAVE</th>
</tr>

</thead>

<tbody id="tableBody">

<tr>
<td colspan="8" class="loading">
Loading Data...
</td>
</tr>

</tbody>

</table>

</div>

<script>

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbzjLprRTqeVntKrRltm6apG6IdeMc5oWX8ci5hOOJskb-zVRna0oWHFoz1iyHriu2P6/exec";



async function loadData(){

  try{

    const res = await fetch(WEB_APP_URL);

    const data = await res.json();

    let rows = "";

    data.forEach((item,index)=>{

      rows += `

      <tr>

        <td>${item.code || ""}</td>

        <td>${item.borrowerId || ""}</td>

        <td>${item.borrowDate || ""}</td>

        <td>${item.submissionDate || ""}</td>

        <td>${item.bookName || ""}</td>

        <td>${item.price || ""}</td>

        <td>

          <select id="status${index}">

            <option value="">Select</option>

            <option value="Returned"
            ${item.status=="Returned" ? "selected" : ""}>
            Returned
            </option>

            <option value="Lost"
            ${item.status=="Lost" ? "selected" : ""}>
            Lost
            </option>

            <option value="Damaged"
            ${item.status=="Damaged" ? "selected" : ""}>
            Damaged
            </option>

          </select>

        </td>

        <td>

          <button class="saveBtn"
          onclick="saveStatus(${index})">

          Save

          </button>

        </td>

      </tr>

      `;
    });

    if(rows==""){

      rows = `
      <tr>
      <td colspan="8" class="loading">
      No Data Found
      </td>
      </tr>
      `;
    }

    document.getElementById("tableBody").innerHTML = rows;

  }

  catch(error){

    document.getElementById("tableBody").innerHTML = `
    <tr>
    <td colspan="8" class="loading">
    Failed To Load Data
    </td>
    </tr>
    `;

    console.log(error);
  }

}



async function saveStatus(index){

  const status =
  document.getElementById("status"+index).value;

  if(status==""){

    alert("Select Status");

    return;
  }

  try{

    const response = await fetch(WEB_APP_URL,{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({

        row:index + 2,
        status:status

      })

    });

    const result = await response.text();

    alert("✅ Status Saved");

    loadData();

  }

  catch(error){

    alert("❌ Save Failed");

    console.log(error);

  }

}



loadData();

</script>

</body>

</html>
