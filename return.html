<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NCPSC Borrow Dashboard</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#f0f9ff,#ffffff,#ecfeff);
  min-height:100vh;
  padding:20px;
}

.title{
  text-align:center;
  font-size:38px;
  font-weight:bold;
  color:#2563eb;
  margin-bottom:25px;
}

.refreshBtn{
  padding:12px 22px;
  border:none;
  border-radius:12px;
  background:#60a5fa;
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

.refreshBtn:hover{
  background:#3b82f6;
}

.tableBox{
  overflow-x:auto;
  border-radius:20px;
  background:#ffffff;
  box-shadow:0 8px 25px rgba(96,165,250,0.15);
  border:1px solid #dbeafe;
}

th{
  background:#93c5fd;
  color:#1e3a8a;
  padding:15px;
  font-size:14px;
}

td{
  padding:14px;
  border-bottom:1px solid #e0f2fe;
  text-align:center;
  font-size:14px;
  color:#334155;
}

tr:hover{
  background:#f0f9ff;
}

select{
  padding:8px 10px;
  border-radius:8px;
  border:1px solid #bfdbfe;
  font-weight:bold;
  background:#f8fbff;
  color:#1e3a8a;
}

.saveBtn{
  padding:8px 14px;
  border:none;
  border-radius:8px;
  background:#4ade80;
  color:white;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

.saveBtn:hover{
  background:#22c55e;
}

.loading{
  padding:25px;
  text-align:center;
  font-size:18px;
  color:#2563eb;
  font-weight:bold;
}

@media(max-width:768px){

  .title{
    font-size:28px;
  }

  th,td{
    font-size:12px;
    padding:10px;
  }

}

</style>

</head>

<body>

<div class="title">
📚 NCPSC Borrow Dashboard
</div>

<div class="topBar">

<button class="refreshBtn" onclick="loadData()">
🔄 Refresh
</button>

</div>

<div class="tableBox">

<table>

<thead>

<tr>

<th>CODE</th>
<th>BORROWER ID</th>
<th>BORROW DATE</th>
<th>SUBMISSION DATE</th>
<th>BOOK NAME</th>
<th>PRICE</th>
<th>STATUS</th>
<th>SAVE</th>

</tr>

</thead>

<tbody id="tableBody">

<tr>

<td colspan="8" class="loading">
Loading Data...
</td>

</tr>

</tbody>

</table>

</div>

<script>

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbz0xuEEwJnB8oS1xfxOXQXt2I6-3LBgGxNhwKbVJh7DxxolEbLODbNBIKo2Q-2Tyh_f2A/exec";






async function loadData(){

  try{

    const response =
      await fetch(WEB_APP_URL);

    const data =
      await response.json();

    let rows = "";



    data.forEach((item,index)=>{

      // SHOW ONLY BORROWED BOOKS

      if(
        !item.status ||
        item.status.toLowerCase() != "borrowed"
      ){
        return;
      }



      rows += `

      <tr>

        <td>${item.code || ""}</td>

        <td>${item.borrowerId || ""}</td>

        <td>
        ${item.borrowDate
        ? new Date(item.borrowDate)
        .toLocaleDateString("en-GB")
        : ""}
        </td>

        <td>
        ${item.submissionDate
        ? new Date(item.submissionDate)
        .toLocaleDateString("en-GB")
        : ""}
        </td>

        <td>${item.bookName || ""}</td>

        <td>${item.price || ""}</td>

        <td>

          <select id="status${index}">

            <option value="">Select</option>

            <option value="Returned">
            Returned
            </option>

            <option value="Lost">
            Lost
            </option>

            <option value="Damaged">
            Damaged
            </option>

          </select>

          <div style="
            margin-top:6px;
            color:#6b8bb6;
            font-weight:bold;
          ">
            Borrowed
          </div>

        </td>

        <td>

          <button class="saveBtn"
          onclick="saveStatus(${index + 2})">

          Save

          </button>

        </td>

      </tr>

      `;
    });




    if(rows==""){

      rows = `

      <tr>

      <td colspan="8" class="loading">
      No Borrowed Books
      </td>

      </tr>

      `;
    }



    document.getElementById("tableBody")
      .innerHTML = rows;

  }

  catch(error){

    console.log(error);

    document.getElementById("tableBody")
    .innerHTML = `

    <tr>

    <td colspan="8" class="loading">
    Failed To Load Data
    </td>

    </tr>

    `;
  }

}









async function saveStatus(row){

  const select =
    document.querySelector(
      `button[onclick="saveStatus(${row})"]`
    ).parentElement.parentElement
    .querySelector("select");



  const status =
    select.value;



  if(status==""){

    alert("Please Select Status");

    return;
  }



  try{

    const response =
      await fetch(WEB_APP_URL,{

      method:"POST",

      mode:"cors",

      headers:{
        "Content-Type":"text/plain"
      },

      body:JSON.stringify({

        row:row,
        status:status

      })

    });




    const result =
      await response.text();

    console.log(result);




    if(
      result.includes("Updated")
      ||
      result.includes("Success")
    ){

      alert("✅ Status Saved");

      loadData();

    }

    else{

      alert(result);
    }

  }

  catch(error){

    console.log(error);

    alert("❌ Save Failed");
  }

}





loadData();

</script>

</body>

</html>
