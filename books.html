<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NCPSC Library Available Books</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Calibri, Arial, sans-serif;
}

body{
    background:#f3f6fb;
    padding:18px;
    color:#111827;
}

.container{
    width:100%;
    max-width:1450px;
    margin:auto;
}

.title{
    text-align:center;
    margin-bottom:14px;
}

.title h1{
    font-size:34px;
    color:#1e3a8a;
    font-weight:900;
    margin-bottom:4px;
}

.title h2{
    font-size:18px;
    color:#2563eb;
    font-weight:700;
}

.search-box{
    margin-bottom:12px;
}

.search-box input{
    width:100%;
    padding:10px 12px;
    border:1px solid #cbd5e1;
    border-radius:4px;
    font-size:14px;
    background:white;
}

.table-wrapper{
    background:white;
    border:1px solid #cbd5e1;
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:700px;
}

thead{
    background:#dbeafe;
}

th{
    border:1px solid #cbd5e1;
    padding:7px 10px;
    text-align:left;
    font-size:14px;
    font-weight:700;
}

td{
    border:1px solid #e2e8f0;
    padding:6px 10px;
    font-size:13px;
}

tbody tr:nth-child(even){
    background:#f8fafc;
}

tbody tr:hover{
    background:#eff6ff;
}

.available{
    color:#15803d;
    font-weight:700;
}

.no-data{
    text-align:center;
    padding:18px;
    font-weight:700;
    color:red;
}

.pagination{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:12px;
}

.pagination button{
    padding:6px 12px;
    border:none;
    background:#2563eb;
    color:white;
    border-radius:4px;
    cursor:pointer;
}

.pagination button:disabled{
    background:#94a3b8;
    cursor:not-allowed;
}

.page-info{
    text-align:center;
    margin-top:8px;
    font-size:14px;
}

</style>
</head>

<body>

<div class="container">

    <div class="title">
        <h1>LIBRARY MANAGEMENT SYSTEM</h1>
        <h2>AVAILABLE BOOKS DASHBOARD</h2>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search Book..." onkeyup="searchBOOKS()">
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>CODE</th>
                    <th>BOOK NAME</th>
                    <th>STATUS</th>
                    <th>PRICE</th>
                </tr>
            </thead>

            <tbody id="tableBody">
                <tr>
                    <td colspan="4" class="no-data">Loading Books...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="pagination">
        <button onclick="prevPage()">Prev</button>
        <button onclick="nextPage()">Next</button>
    </div>

    <div class="page-info" id="pageInfo"></div>

</div>

<script>

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbyhuefa3B9Vv7ydTmpMuVA3wyVqFw8Q0Vq81T70i5nXGUqitQ5LIkVmVOqz3uJtmpnqJA/exec";

let allBOOKS = [];
let currentPage = 1;
const rowsPerPage = 50;

// =========================
// LOAD BOOKS
// =========================
async function loadBOOKS(){

    try{

        const res = await fetch(WEB_APP_URL);
        const data = await res.json();

        const books = data.books || [];

        allBOOKS = books.filter(book => 
            String(book.STATUS || "").toLowerCase().includes("available")
        );

        renderTable();

    }catch(err){
        document.getElementById("tableBody").innerHTML =
        `<tr><td colspan="4" class="no-data">Failed To Load Data</td></tr>`;
    }
}


// =========================
// RENDER TABLE (PAGINATION)
// =========================
function renderTable(){

    const tableBody = document.getElementById("tableBody");
    tableBody.innerHTML = "";

    const start = (currentPage - 1) * rowsPerPage;
    const end = start + rowsPerPage;

    const pageData = allBOOKS.slice(start, end);

    if(pageData.length === 0){
        tableBody.innerHTML =
        `<tr><td colspan="4" class="no-data">No Available Books Found</td></tr>`;
        return;
    }

    pageData.forEach(book => {
        tableBody.innerHTML += `
            <tr>
                <td>${book.CODE || ""}</td>
                <td>${book["BOOK NAME"] || ""}</td>
                <td class="available">${book.STATUS || ""}</td>
                <td>${book.PRICE || ""}</td>
            </tr>
        `;
    });

    document.getElementById("pageInfo").innerText =
        `Page ${currentPage} of ${Math.ceil(allBOOKS.length / rowsPerPage)}`;
}


// =========================
// NEXT PAGE
// =========================
function nextPage(){
    if(currentPage < Math.ceil(allBOOKS.length / rowsPerPage)){
        currentPage++;
        renderTable();
    }
}


// =========================
// PREV PAGE
// =========================
function prevPage(){
    if(currentPage > 1){
        currentPage--;
        renderTable();
    }
}


// =========================
// SEARCH
// =========================
function searchBOOKS(){

    const value = document.getElementById("searchInput").value.toLowerCase();

    const filtered = allBOOKS.filter(book =>
        (book.CODE || "").toLowerCase().includes(value) ||
        (book["BOOK NAME"] || "").toLowerCase().includes(value) ||
        (book.PRICE || "").toString().toLowerCase().includes(value)
    );

    currentPage = 1;
    allBOOKS = filtered;
    renderTable();
}


// START
loadBOOKS();

</script>

</body>
</html>
