<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Library Borrow System</title>

<style>
  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
  }

  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#dbeafe,#eff6ff,#ffffff);
    padding:20px;
  }

  .container{
    width:100%;
    max-width:500px;
    background:#ffffff;
    border-radius:20px;
    padding:40px 30px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
  }

  .title{
    text-align:center;
    font-size:34px;
    font-weight:bold;
    color:#1e3a8a;
    margin-bottom:10px;
  }

  .subtitle{
    text-align:center;
    font-size:16px;
    color:#475569;
    margin-bottom:35px;
  }

  .input-group{
    margin-bottom:25px;
  }

  label{
    display:block;
    margin-bottom:8px;
    font-size:15px;
    font-weight:bold;
    color:#1e293b;
  }

  input{
    width:100%;
    padding:15px;
    border:2px solid #cbd5e1;
    border-radius:12px;
    font-size:16px;
    transition:0.3s;
    outline:none;
  }

  input:focus{
    border-color:#2563eb;
    box-shadow:0 0 10px rgba(37,99,235,0.2);
  }

  button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
  }

  button:hover{
    background:#1d4ed8;
  }

  .message{
    margin-top:20px;
    text-align:center;
    font-size:16px;
    font-weight:bold;
  }

  .success{
    color:green;
  }

  .error{
    color:red;
  }
</style>
</head>

<body>

<div class="container">

  <div class="title">
    LIBRARY MANAGEMENT SYSTEM
  </div>

  <div class="subtitle">
    Borrow Book Entry
  </div>

  <form id="borrowForm">

    <div class="input-group">
      <label>Book Code</label>
      <input type="text" id="code" placeholder="Enter Book Code" required />
    </div>

    <div class="input-group">
      <label>Borrower's ID</label>
      <input type="text" id="borrowerId" placeholder="Enter Borrower's ID" required />
    </div>

    <button type="submit">
      SAVE DATA
    </button>

  </form>

  <div id="message" class="message"></div>

</div>

<script>

const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzjLprRTqeVntKrRltm6apG6IdeMc5oWX8ci5hOOJskb-zVRna0oWHFoz1iyHriu2P6/exec";

document.getElementById("borrowForm").addEventListener("submit", async function(e){

  e.preventDefault();

  const code = document.getElementById("code").value.trim();
  const borrowerId = document.getElementById("borrowerId").value.trim();

  const message = document.getElementById("message");

  message.innerHTML = "Saving...";
  message.className = "message";

  try{

    const response = await fetch(WEB_APP_URL,{
      method:"POST",
      body:JSON.stringify({
        action:"saveBorrow",
        code:code,
        borrowerId:borrowerId
      })
    });

    const result = await response.text();

    if(result.includes("Success")){

      message.innerHTML = "✅ Data Saved Successfully";
      message.className = "message success";

      document.getElementById("borrowForm").reset();

    }else{

      message.innerHTML = "❌ Failed To Save Data";
      message.className = "message error";

    }

  }catch(error){

    message.innerHTML = "❌ Server Connection Failed";
    message.className = "message error";

  }

});

</script>

</body>
</html>
