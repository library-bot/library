<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NCPSC Library Borrow System</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:linear-gradient(135deg,#1565c0,#00c853);
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .container{
      background:white;
      width:100%;
      max-width:450px;
      padding:35px;
      border-radius:20px;
      box-shadow:0 10px 25px rgba(0,0,0,0.2);
    }

    .logo{
      text-align:center;
      font-size:45px;
      margin-bottom:10px;
    }

    h1{
      text-align:center;
      color:#1565c0;
      margin-bottom:10px;
    }

    p{
      text-align:center;
      color:#555;
      margin-bottom:30px;
    }

    .input-group{
      margin-bottom:20px;
    }

    label{
      display:block;
      margin-bottom:8px;
      font-weight:bold;
      color:#333;
    }

    input{
      width:100%;
      padding:14px;
      border:2px solid #ddd;
      border-radius:10px;
      font-size:16px;
    }

    input:focus{
      outline:none;
      border-color:#1565c0;
      box-shadow:0 0 8px rgba(21,101,192,0.3);
    }

    button{
      width:100%;
      padding:15px;
      border:none;
      border-radius:10px;
      background:linear-gradient(135deg,#1565c0,#00c853);
      color:white;
      font-size:17px;
      font-weight:bold;
      cursor:pointer;
    }

    button:hover{
      opacity:0.95;
    }

    .message{
      margin-top:20px;
      text-align:center;
      font-weight:bold;
    }

    .success{
      color:green;
    }

    .error{
      color:red;
    }

  </style>
</head>
<body>

  <div class="container">

    <div class="logo">📚</div>

    <h1>NCPSC Library</h1>

    <p>Borrow Book Entry System</p>

    <form id="borrowForm">

      <div class="input-group">
        <label>Book Code</label>

        <input
          type="text"
          id="bookCode"
          placeholder="Enter Book Code"
          required
        />
      </div>

      <div class="input-group">
        <label>Borrower's ID</label>

        <input
          type="text"
          id="borrowerId"
          placeholder="Enter Borrower's ID"
          required
        />
      </div>

      <button type="submit">
        Save Borrow Info
      </button>

      <div id="message" class="message"></div>

    </form>

  </div>





<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzjLprRTqeVntKrRltm6apG6IdeMc5oWX8ci5hOOJskb-zVRna0oWHFoz1iyHriu2P6/exec";



const form = document.getElementById("borrowForm");
const message = document.getElementById("message");



form.addEventListener("submit", async (e)=>{

  e.preventDefault();

  const bookCode =
    document.getElementById("bookCode").value.trim();

  const borrowerId =
    document.getElementById("borrowerId").value.trim();



  message.innerHTML = "Saving...";
  message.className = "message";



  try{

    const response = await fetch(SCRIPT_URL,{
      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        code:bookCode,
        borrowerId:borrowerId
      })
    });



    const result = await response.text();

    console.log(result);



    message.innerHTML =
      "✅ Borrow information saved successfully!";

    message.className = "message success";



    form.reset();

  }
  catch(error){

    console.error(error);

    message.innerHTML =
      "❌ Failed to save data.";

    message.className = "message error";
  }

});

</script>

</body>
</html>
