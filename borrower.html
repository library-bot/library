<!DOCTYPE html>
<html lang="en">

<head>

  <base target="_top">

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NCPSC Library Management System</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      min-height:100vh;
      background:linear-gradient(135deg,#e3f2fd,#f5f7ff);
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .container{
      width:100%;
      max-width:480px;
      background:#ffffff;
      border-radius:22px;
      padding:40px 35px;
      box-shadow:0 10px 35px rgba(0,0,0,0.12);
      animation:fadeIn 0.5s ease;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(20px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .college{
      text-align:center;
      font-size:15px;
      font-weight:bold;
      color:#0b57d0;
      letter-spacing:1px;
      margin-bottom:10px;
    }

    .title{
      text-align:center;
      font-size:30px;
      font-weight:bold;
      color:#111827;
      margin-bottom:30px;
      line-height:1.3;
    }

    .input-group{
      margin-bottom:20px;
    }

    label{
      display:block;
      margin-bottom:8px;
      font-size:14px;
      font-weight:bold;
      color:#374151;
    }

    input{
      width:100%;
      padding:15px;
      border:1px solid #d1d5db;
      border-radius:12px;
      outline:none;
      font-size:15px;
      transition:0.3s;
      background:#f9fafb;
    }

    input:focus{
      border-color:#0b57d0;
      background:#ffffff;
      box-shadow:0 0 0 4px rgba(11,87,208,0.15);
    }

    button{
      width:100%;
      padding:16px;
      border:none;
      border-radius:14px;
      background:linear-gradient(135deg,#0b57d0,#2563eb);
      color:white;
      font-size:17px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
      margin-top:5px;
    }

    button:hover{
      transform:translateY(-2px);
      box-shadow:0 10px 20px rgba(37,99,235,0.25);
    }

    button:active{
      transform:scale(0.98);
    }

    .loading{
      opacity:0.7;
      pointer-events:none;
    }

    #message{
      margin-top:20px;
      padding:14px;
      border-radius:12px;
      text-align:center;
      font-weight:bold;
      display:none;
      animation:fadeIn 0.3s ease;
    }

    .success{
      background:#dcfce7;
      color:#166534;
    }

    .error{
      background:#fee2e2;
      color:#991b1b;
    }

    .footer{
      text-align:center;
      margin-top:25px;
      color:#6b7280;
      font-size:13px;
    }

  </style>

</head>

<body>

  <div class="container">

    <div class="college">
      NIRJHOR CANTONMENT PUBLIC SCHOOL & COLLEGE
    </div>

    <div class="title">
      LIBRARY MANAGEMENT SYSTEM
    </div>

    <div class="input-group">
      <label>BOOK CODE</label>
      <input
        type="text"
        id="code"
        placeholder="Enter Book Code"
        autocomplete="off"
      >
    </div>

    <div class="input-group">
      <label>BORROWER ID</label>
      <input
        type="text"
        id="borrowerId"
        placeholder="Enter Borrower ID"
        autocomplete="off"
      >
    </div>

    <button id="submitBtn" onclick="saveBorrow()">
      BORROW BOOK
    </button>

    <div id="message"></div>

    <div class="footer">
      NCPSC Library Automation System
    </div>

  </div>

<script>

function saveBorrow(){

  const code =
    document.getElementById("code").value.trim();

  const borrowerId =
    document.getElementById("borrowerId").value.trim();

  if(!code || !borrowerId){

    showMessage(
      "Please Fill All Fields",
      "error"
    );

    return;
  }

  const button =
    document.getElementById("submitBtn");

  button.classList.add("loading");

  // Instant smooth feeling
  showMessage(
    "Saving Successfully...",
    "success"
  );

  google.script.run

    .withSuccessHandler(function(response){

      button.classList.remove("loading");

      if(response.success){

        showMessage(
          "Book Borrowed Successfully",
          "success"
        );

        document.getElementById("code").value = "";
        document.getElementById("borrowerId").value = "";

        document.getElementById("code").focus();

      } else {

        showMessage(
          response.message,
          "error"
        );
      }

    })

    .withFailureHandler(function(error){

      button.classList.remove("loading");

      showMessage(
        "Failed To Connect Server",
        "error"
      );

      console.log(error);

    })

    .saveBorrow({
      code: code,
      borrowerId: borrowerId
    });

}

function showMessage(message,type){

  const msg =
    document.getElementById("message");

  msg.style.display = "block";

  msg.className = type;

  msg.innerHTML = message;

  setTimeout(function(){

    msg.style.display = "none";

  },4000);

}

// Enter key submit

document.addEventListener("keypress",function(e){

  if(e.key === "Enter"){

    saveBorrow();
  }

});

</script>

</body>
</html>
