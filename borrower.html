<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NCPSC Library Borrow System</title>

<style>
body{
  background:linear-gradient(135deg,#1565c0,#00c853);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial;
}

.container{
  background:#fff;
  padding:30px;
  width:100%;
  max-width:420px;
  border-radius:15px;
}

input{
  width:100%;
  padding:12px;
  margin-bottom:15px;
  border:1px solid #ccc;
  border-radius:8px;
}

button{
  width:100%;
  padding:12px;
  background:#1565c0;
  color:white;
  border:none;
  border-radius:8px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<h2>📚 Borrow Book</h2>

<form id="borrowForm">

<input type="text" id="bookCode" placeholder="Book Code" required />
<input type="text" id="borrowerId" placeholder="Borrower ID" required />

<button type="submit">Save</button>

<p id="msg"></p>

</form>

</div>

<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzjLprRTqeVntKrRltm6apG6IdeMc5oWX8ci5hOOJskb-zVRna0oWHFoz1iyHriu2P6/exec";


document.getElementById("borrowForm").addEventListener("submit", async (e)=>{
  e.preventDefault();

  const bookCode = document.getElementById("bookCode").value.trim();
  const borrowerId = document.getElementById("borrowerId").value.trim();

  const msg = document.getElementById("msg");
  msg.innerText = "Saving...";

  try{

    // ✅ FIX: FORM DATA (NOT JSON)
    const res = await fetch(SCRIPT_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/x-www-form-urlencoded"
      },
      body:
        "action=borrow" +
        "&code=" + encodeURIComponent(bookCode) +
        "&borrowerId=" + encodeURIComponent(borrowerId)
    });

    const text = await res.text();
    const result = JSON.parse(text);

    if(result.status === "success"){
      msg.innerText = "✅ Saved successfully";
      document.getElementById("borrowForm").reset();
    } else {
      msg.innerText = "❌ " + result.message;
    }

  } catch(err){
    console.log(err);
    msg.innerText = "❌ Failed to connect to server";
  }

});

</script>

</body>
</html>
