<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NCPSC Library Borrow</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#dbeafe,#eff6ff);
}

.container{
  width:380px;
  background:white;
  padding:35px;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

h1{
  text-align:center;
  color:#1d4ed8;
  margin-bottom:30px;
  font-size:28px;
}

input{
  width:100%;
  padding:15px;
  margin-bottom:18px;
  border:1px solid #cbd5e1;
  border-radius:12px;
  font-size:16px;
  outline:none;
  transition:0.3s;
}

input:focus{
  border-color:#2563eb;
  box-shadow:0 0 8px rgba(37,99,235,0.3);
}

button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  background:#1e40af;
}

#message{
  margin-top:18px;
  text-align:center;
  font-weight:bold;
  font-size:15px;
}

.success{
  color:green;
}

.error{
  color:red;
}

</style>
</head>

<body>

<div class="container">

  <h1>Library Borrow</h1>

  <input
    type="text"
    id="code"
    placeholder="Enter Book Code"
  >

  <input
    type="text"
    id="borrowerId"
    placeholder="Enter Borrower ID"
  >

  <button onclick="submitData()">
    SUBMIT
  </button>

  <div id="message"></div>

</div>

<script>

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbzjLprRTqeVntKrRltm6apG6IdeMc5oWX8ci5hOOJskb-zVRna0oWHFoz1iyHriu2P6/exec";

async function submitData(){

  const code =
    document.getElementById("code").value.trim();

  const borrowerId =
    document.getElementById("borrowerId").value.trim();

  const message =
    document.getElementById("message");

  if(code === "" || borrowerId === ""){

    message.innerHTML =
      "Please fill all fields";

    message.className = "error";

    return;
  }

  try{

    const response = await fetch(WEB_APP_URL,{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        code:code,
        borrowerId:borrowerId
      })
    });

    const result = await response.json();

    if(result.success){

      message.innerHTML =
        "Data Saved Successfully";

      message.className = "success";

      document.getElementById("code").value = "";
      document.getElementById("borrowerId").value = "";

    }else{

      message.innerHTML =
        result.message;

      message.className = "error";
    }

  }catch(error){

    message.innerHTML =
      "Failed To Connect Server";

    message.className = "error";
  }

}

</script>

</body>
</html>
