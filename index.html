<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library Management System</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            height:100vh;

            font-family:"Segoe UI", sans-serif;

            background:#f8fbff;

            overflow:hidden;
        }

        .container{

            width:100%;
            height:100vh;

            display:flex;
            flex-direction:column;

            align-items:center;

            text-align:center;

            padding:30px;
        }

        /* TOP TITLE */

        h1{

            margin-top:20px;

            font-size:clamp(38px, 5vw, 90px);

            color:#2563eb;

            font-weight:900;

            text-transform:uppercase;

            letter-spacing:3px;
        }

        /* BUTTON */

        .btn{

            margin-top:auto;

            text-decoration:none;

            background:#2563eb;

            color:white;

            padding:22px 60px;

            font-size:clamp(20px, 2vw, 32px);

            font-weight:700;

            border-radius:14px;

            text-transform:uppercase;

            transition:0.3s ease;

            box-shadow:
                0 10px 25px rgba(37,99,235,0.2);
        }

        .btn:hover{

            background:#1d4ed8;

            transform:translateY(-2px);
        }

        .info{

            margin-top:25px;

            margin-bottom:auto;

            font-size:15px;

            color:#64748b;

            text-transform:uppercase;

            letter-spacing:1px;
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>
            LIBRARY MANAGEMENT SYSTEM
        </h1>

        <a href="admin-panel.html" class="btn">
            ENTER LIBRARY ADMIN PANEL
        </a>

        <div class="info">
            PRESS ENTER KEY FOR QUICK ACCESS
        </div>

    </div>

    <script>

        // Redirect when Enter key is pressed

        document.addEventListener("keydown", function(event){

            if(event.key === "Enter"){

                window.location.href = "admin-panel.html";
            }
        });

    </script>

</body>
</html>
