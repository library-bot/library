<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NCPSC Library System</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            font-family:"Segoe UI", sans-serif;

            background: linear-gradient(
                135deg,
                #edf6ff,
                #dbeeff,
                #f7fbff
            );

            overflow:hidden;
        }

        .container{

            width:100%;
            height:100vh;

            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;

            text-align:center;

            padding:40px;
        }

        h1{

            font-size:85px;

            color:#2b5d8a;

            font-weight:700;

            line-height:1.2;

            max-width:1200px;

            margin-bottom:30px;
        }

        h2{

            font-size:42px;

            color:#4a90e2;

            font-weight:600;

            margin-bottom:40px;
        }

        .btn{

            text-decoration:none;

            background:#4a90e2;

            color:white;

            padding:20px 55px;

            font-size:28px;

            font-weight:600;

            border-radius:14px;

            transition:0.3s ease;

            box-shadow:
                0 10px 25px rgba(74,144,226,0.25);
        }

        .btn:hover{

            background:#357bd8;

            transform:translateY(-3px);
        }

        .info{

            margin-top:25px;

            font-size:18px;

            color:#6b7280;
        }

        @media(max-width:900px){

            h1{
                font-size:52px;
            }

            h2{
                font-size:30px;
            }

            .btn{
                font-size:22px;
                padding:18px 40px;
            }
        }

        @media(max-width:600px){

            h1{
                font-size:38px;
            }

            h2{
                font-size:24px;
            }

            .btn{
                font-size:20px;
                padding:15px 35px;
            }

            .info{
                font-size:15px;
            }
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>
            Nirjhor Cantonment Public School & College
        </h1>

        <h2>
            Library Management System
        </h2>

        <a href="admin-panel.html" class="btn">
            Enter Library Admin Panel
        </a>

        <div class="info">
            Press ENTER key for quick access
        </div>

    </div>

    <script>

        // Redirect when Enter key is pressed

        document.addEventListener("keydown", function(event){

            if(event.key === "Enter"){

                window.location.href = "admin-panel.html";
            }
        });

    </script>

</body>
</html>
