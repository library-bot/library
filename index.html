<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NCPSC Library System</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #0f4c75, #3282b8);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            background: rgba(0, 0, 0, 0.4);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            width: 80%;
            max-width: 700px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        h2 {
            font-size: 28px;
            margin-bottom: 15px;
            color: #ffd369;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            background: #ffd369;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #ffffff;
            color: #0f4c75;
        }

        .info {
            margin-top: 20px;
            font-size: 14px;
            color: #ddd;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome</h1>

        <h2>Nirjhor Cantonment Public School & College</h2>
        <h2>Library Management System</h2>

        <p>
            Press the <strong>Enter</strong> button below to access
            the Library Admin Panel of NCPSC.
        </p>

        <!-- Change admin-panel.html to your actual admin panel page -->
        <a href="admin-panel.html" class="btn">Enter</a>

        <div class="info">
            Redirecting to Library Admin Panel...
        </div>
    </div>

    <script>
        // Auto redirect when Enter key is pressed
        document.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                window.location.href = "admin-panel.html";
            }
        });
    </script>

</body>
</html>
