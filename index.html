<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NCPSC Library System</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            font-family:"Segoe UI", sans-serif;

            background: linear-gradient(
                135deg,
                #edf6ff,
                #dbeeff,
                #f7fbff
            );

            overflow:hidden;
        }

        .container{

            width:100%;
            height:100vh;

            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;

            text-align:center;

            padding:30px;
        }

        h1{

            width:100%;

            font-size:clamp(28px, 4vw, 80px);

            color:#2b5d8a;

            font-weight:800;

            text-transform:uppercase;

            line-height:1.2;

            margin-bottom:30px;
        }

        h2{

            font-size:clamp(22px, 2.5vw, 42px);

            color:#4a90e2;

            font-weight:600;

            margin-bottom:45px;

            text-transform:uppercase;
        }

        .btn{

            text-decoration:none;

            background:#4a90e2;

            color:white;

            padding:20px 55px;

            font-size:clamp(18px, 2vw, 30px);

            font-weight:700;

            border-radius:14px;

            text-transform:uppercase;

            transition:0.3s ease;

            box-shadow:
                0 10px 25px rgba(74,144,226,0.25);
        }

        .btn:hover{

            background:#357bd8;

            transform:translateY(-3px);
        }

        .info{

            margin-top:25px;

            font-size:16px;

            color:#6b7280;

            text-transform:uppercase;
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>
            NIRJHOR CANTONMENT PUBLIC SCHOOL & COLLEGE
        </h1>

        <h2>
            LIBRARY MANAGEMENT SYSTEM
        </h2>

        <a href="admin-panel.html" class="btn">
            ENTER LIBRARY ADMIN PANEL
        </a>

        <div class="info">
            PRESS ENTER KEY FOR QUICK ACCESS
        </div>

    </div>

    <script>

        // Redirect when Enter key is pressed

        document.addEventListener("keydown", function(event){

            if(event.key === "Enter"){

                window.location.href = "admin-panel.html";
            }
        });

    </script>

</body>
</html>
