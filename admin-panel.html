<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin Panel</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#dbeafe,#ede9fe,#fef3c7);
}

.panel{
    width:95%;
    max-width:900px;
    background:white;
    padding:40px;
    border-radius:25px;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

.title{
    text-align:center;
    font-size:32px;
    font-weight:600;
    color:#1e293b;
    margin-bottom:35px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.btn{
    border:none;
    padding:25px;
    border-radius:18px;
    font-size:18px;
    font-weight:500;
    cursor:pointer;
    transition:0.3s;
    color:white;
    box-shadow:0 6px 15px rgba(0,0,0,0.12);
}

.btn:hover{
    transform:translateY(-5px) scale(1.03);
}

.btn1{background:linear-gradient(135deg,#3b82f6,#2563eb);}
.btn2{background:linear-gradient(135deg,#10b981,#059669);}
.btn3{background:linear-gradient(135deg,#f59e0b,#d97706);}
.btn4{background:linear-gradient(135deg,#ef4444,#dc2626);}
.btn5{background:linear-gradient(135deg,#8b5cf6,#7c3aed);}
.btn6{background:linear-gradient(135deg,#06b6d4,#0891b2);}

.footer{
    margin-top:30px;
    text-align:center;
    color:#64748b;
    font-size:14px;
}

</style>
</head>

<body>

<div class="panel">

    <div class="title">
        Library Admin Panel
    </div>

    <div class="grid">

        <button class="btn btn1" onclick="goSite()">
            Dashboard
        </button>

        <button class="btn btn2" onclick="goSite()">
            Students
        </button>

        <button class="btn btn3" onclick="goSite()">
            Teachers
        </button>

        <button class="btn btn4" onclick="goSite()">
            Attendance
        </button>

        <button class="btn btn5" onclick="goSite()">
            Results
        </button>

        <button class="btn btn6" onclick="goSite()">
            Settings
        </button>

    </div>

    <div class="footer">
        © NCP School & College Admin System
    </div>

</div>

<script>

function goSite(){
    window.location.href = "https://ncpsc.edu.bd";
}

</script>

</body>
</html>
