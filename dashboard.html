<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Books</title>

  <style>
    body {
      font-family: Arial;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

    h1 {
      text-align: center;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: #007bff;
      color: white;
      padding: 10px;
    }

    td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }

    tr:hover {
      background: #f1f1f1;
    }

    .badge {
      padding: 4px 10px;
      border-radius: 20px;
      color: white;
      font-size: 12px;
    }

    .available { background: green; }
    .sold { background: red; }
    .other { background: orange; }

    .loading {
      text-align: center;
      margin: 20px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>📚 Books List</h1>

  <input type="text" id="search" placeholder="Search books...">

  <div id="loading" class="loading">Loading books...</div>

  <table id="table" style="display:none;">
    <thead>
      <tr>
        <th>S/L</th>
        <th>CODE</th>
        <th>NAME</th>
        <th>PRICE</th>
        <th>STATUS</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbzjLprRTqeVntKrRltm6apG6IdeMc5oWX8ci5hOOJskb-zVRna0oWHFoz1iyHriu2P6/exec";

let books = [];

fetch(API_URL)
  .then(res => res.text())
  .then(text => {

    books = JSON.parse(text);

    render(books);

    document.getElementById("loading").style.display = "none";
    document.getElementById("table").style.display = "table";
  });

function render(data) {

  const tbody = document.getElementById("tbody");

  let html = "";

  data.forEach(b => {

    let status = (b.STATUS || "").toLowerCase();

    let badge =
      status === "available" ? "available" :
      status === "sold" ? "sold" : "other";

    html += `
      <tr>
        <td>${b["S/L"] || ""}</td>
        <td>${b.CODE || ""}</td>
        <td>${b.NAME || ""}</td>
        <td>${b.PRICE || ""}</td>
        <td><span class="badge ${badge}">${b.STATUS || ""}</span></td>
      </tr>
    `;
  });

  tbody.innerHTML = html;
}

/* SEARCH */
document.getElementById("search").addEventListener("input", function () {

  let val = this.value.toLowerCase();

  let filtered = books.filter(b =>
    (b.NAME || "").toLowerCase().includes(val) ||
    (b.CODE || "").toLowerCase().includes(val)
  );

  render(filtered);
});

</script>

</body>
</html>
