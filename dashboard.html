<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Books Store</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    /* Search box */
    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    /* Table */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th {
      background: #007bff;
      color: white;
      padding: 12px;
      text-align: left;
    }

    td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }

    tr:hover {
      background: #f1f1f1;
    }

    /* Status */
    .badge {
      padding: 5px 10px;
      border-radius: 20px;
      color: white;
      font-size: 12px;
    }

    .available { background: green; }
    .sold { background: red; }
    .other { background: orange; }

    /* Cards (mobile view) */
    .cards {
      display: none;
      grid-template-columns: 1fr;
      gap: 15px;
    }

    .card {
      background: #fff;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .card h3 {
      margin: 0 0 5px;
    }

    .row {
      margin: 4px 0;
      font-size: 14px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      table {
        display: none;
      }
      .cards {
        display: grid;
      }
    }

    .loading {
      text-align: center;
      margin: 20px;
      font-size: 18px;
      color: #555;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>📚 Books Store</h1>

  <input type="text" id="search" placeholder="Search by name or code...">

  <div id="loading" class="loading">Loading books...</div>

  <!-- TABLE VIEW -->
  <table id="table" style="display:none;">
    <thead>
      <tr>
        <th>S/L</th>
        <th>CODE</th>
        <th>NAME</th>
        <th>PRICE</th>
        <th>STATUS</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <!-- CARD VIEW -->
  <div class="cards" id="cards"></div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbzjLprRTqeVntKrRltm6apG6IdeMc5oWX8ci5hOOJskb-zVRna0oWHFoz1iyHriu2P6/exec";

let booksData = [];

fetch(API_URL)
  .then(res => res.text())
  .then(text => {

    booksData = JSON.parse(text);

    renderBooks(booksData);

    document.getElementById("loading").style.display = "none";
    document.getElementById("table").style.display = "table";
  })
  .catch(err => {
    console.error(err);
    document.getElementById("loading").innerText =
      "Failed to load books";
  });

function renderBooks(data) {

  const tbody = document.getElementById("tbody");
  const cards = document.getElementById("cards");

  tbody.innerHTML = "";
  cards.innerHTML = "";

  data.forEach(book => {

    let status = (book.STATUS || "").toLowerCase();

    let badgeClass =
      status === "available" ? "available" :
      status === "sold" ? "sold" : "other";

    // TABLE ROW
    tbody.innerHTML += `
      <tr>
        <td>${book["S/L"] || ""}</td>
        <td>${book["CODE"] || ""}</td>
        <td>${book["NAME"] || ""}</td>
        <td>${book["PRICE"] || ""}</td>
        <td><span class="badge ${badgeClass}">${book.STATUS || ""}</span></td>
      </tr>
    `;

    // CARD VIEW
    cards.innerHTML += `
      <div class="card">
        <h3>${book.NAME || ""}</h3>
        <div class="row"><b>Code:</b> ${book.CODE || ""}</div>
        <div class="row"><b>Price:</b> ${book.PRICE || ""}</div>
        <div class="row">
          <b>Status:</b>
          <span class="badge ${badgeClass}">${book.STATUS || ""}</span>
        </div>
      </div>
    `;
  });
}

// SEARCH
document.getElementById("search").addEventListener("input", function() {

  let value = this.value.toLowerCase();

  let filtered = booksData.filter(book =>
    (book.NAME || "").toLowerCase().includes(value) ||
    (book.CODE || "").toLowerCase().includes(value)
  );

  renderBooks(filtered);
});

</script>

</body>
</html>
