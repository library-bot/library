<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Books Popup</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #eef2ff;
      font-family: Arial, sans-serif;
    }

    .box {
      background: #ffffff;
      padding: 40px 50px;
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.12);
      text-align: center;
      border: 1px solid #e6e6e6;
    }

    .title {
      font-size: 24px;
      font-weight: bold;
      color: #222;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 18px;
      color: #2b7cff;
      font-weight: 500;
    }
  </style>
</head>

<body>

  <div class="box">
    <div class="title">Books Dashboard</div>
    <div class="subtitle">Available Books</div>
  </div>

</body>
</html>
